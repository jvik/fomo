[build-system]
requires = ["hatchling", "hatch-vcs", "argparse-manpage"]
build-backend = "hatchling.build"

[project]
name = "fomo"
dynamic = ["version"]
description = "TUI for Azure PIM role activation with multiselect"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2,<9",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest",
    "ruff>=0.17.4",
]

[project.scripts]
fomo = "fomo.__main__:main"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["fomo"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "fomo/_version.py"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Tests request pytest fixtures for their side effects (patching, kill switch)
# and fakes mirror the real signatures, so unused arguments are intentional.
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = false
